    <!-- Single Page Apps for GitHub Pages: Clean URL restoration (removes /#/ requirement) -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        } else if (l.hash && l.hash.startsWith('#/')) {
          // Graceful auto-upgrade for legacy hash links (e.g. /#/prospects -> /prospects)
          var cleanRoute = l.hash.slice(2);
          var base = l.pathname.replace(/\/$/, '');
          window.history.replaceState(null, null, base + '/' + cleanRoute);
        }
      }(window.location))
    </script>
